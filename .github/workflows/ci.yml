name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Testes (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, intl, gd, zip
          coverage: none

      - name: Cache das dependências do Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Instalar dependências PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar o ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Instalar e compilar o front-end
        run: |
          npm ci
          npm run build

      - name: Rodar a suíte de testes
        run: php artisan test

  estilo:
    name: Padrão de código (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Instalar dependências PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verificar o estilo sem alterar arquivos
        run: vendor/bin/pint --test

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          load: true
          tags: helpdesk-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar se o contêiner sobe e responde
        run: |
          docker run -d --name helpdesk -p 8080:8080 \
            -e APP_ENV=production \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=/var/www/html/database/database.sqlite \
            helpdesk-app:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/up > /dev/null; then
              echo "Aplicação respondeu em /up"
              exit 0
            fi
            sleep 2
          done
          echo "A aplicação não respondeu a tempo. Logs:"
          docker logs helpdesk
          exit 1
