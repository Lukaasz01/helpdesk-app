# Blueprint do Render: cria a aplicação e o banco em um clique.
# https://render.com/docs/blueprint-spec
#
# Em Render → New → Blueprint, aponte para este repositório. As variáveis
# marcadas com sync: false são pedidas na hora do provisionamento.

services:
  - type: web
    name: helpdesk-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Helpdesk
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Gerada automaticamente pelo Render e mantida entre os deploys.
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: helpdesk-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: helpdesk-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: helpdesk-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: helpdesk-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: helpdesk-db
          property: password

databases:
  - name: helpdesk-db
    plan: free
    databaseName: helpdesk
    user: helpdesk
